# Scratch-only: before/after simulator screenshots for nuphos/nuphos#4044. Deleted after use.
name: scratch 4044 iOS shots
on:
  push:
    branches: [scratch/4044-ios-shots]
permissions:
  contents: read
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Simulator
        id: sim
        run: |
          set -euo pipefail
          type=$(xcrun simctl list devicetypes | sed -n 's/^iPhone 17 Pro (\(.*\))$/\1/p' | head -1)
          runtime=$(xcrun simctl list runtimes -j | node -e '
            const ios = JSON.parse(require("fs").readFileSync(0, "utf8")).runtimes
              .filter((r) => r.isAvailable && r.identifier.includes("SimRuntime.iOS"))
              .filter((r) => r.supportedDeviceTypes.some((d) => d.name === "iPhone 17 Pro"))
              .sort((a, b) => a.version.localeCompare(b.version, undefined, { numeric: true }))
            console.log(ios.at(-1).identifier)')
          udid=$(xcrun simctl create shots "$type" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl ui "$udid" appearance light
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Before and after
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          for pair in before:307d41dc9e084cad12ac51c19b95d295e1b8c3e2 after:e0f6e8cbb12f1498c7d35d9604f876a800daadb3; do
            label=${pair%%:*} sha=${pair#*:}
            tree="$RUNNER_TEMP/$label"
            git worktree add --detach "$tree" "$sha"
            python3 scripts/scratch-4044/harness.py "$tree"
            (cd "$tree/apps/ios" && xcodebuild -project nuphos-ios.xcodeproj -scheme nuphos-ios -configuration Debug \
              -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd-$label" \
              CODE_SIGNING_ALLOWED=NO build -quiet)
            app=$(ls -d "$RUNNER_TEMP/dd-$label"/Build/Products/Debug-iphonesimulator/*.app | grep -v Tests | head -1)
            bash scripts/scratch-4044/shots.sh "$UDID" "$app" "$RUNNER_TEMP/shots" "$label"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: shots-4044-ios
          path: ${{ runner.temp }}/shots
          retention-days: 3
